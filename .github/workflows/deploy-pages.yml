name: Publish GitHub Pages site

on:
  push:
    branches: [main]

# Pages publishes the main branch root. This job rebuilds that root and pushes
# the static files. A GITHUB_TOKEN push does not start another Actions run.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site into the repo root
        run: npm run build:pages

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if git diff --staged --quiet; then
            echo "Site already up to date"
          else
            git commit -m "Publish built site for GitHub Pages"
            git push
          fi
